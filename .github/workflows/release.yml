name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Fail-closed gate. Runs before anything is built so a release that cannot be
  # signed dies in seconds rather than after ~12 minutes of cross-compilation.
  #
  # The preflight checks for an Azure Trusted Signing identity (AZURE_CLIENT_ID,
  # scoped to the 'release' environment). Its presence is the signal that the
  # OIDC federation + RBAC on the certificate profile are configured. The build
  # fails instead of silently publishing unsigned, unless ALLOW_UNSIGNED_RELEASE
  # is set explicitly.
  signing-preflight:
    name: "Preflight - release signing"
    runs-on: ubuntu-latest
    environment: release
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Signing guard (signed, or the release fails)
        id: guard
        run: ./scripts/lib/signing.sh preflight "Community release"

  tests:
    name: "Run Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -v -race ./...

  build-windows:
    name: "Build and sign Windows (amd64)"
    needs: [tests, signing-preflight]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      # Required for the azure/login OIDC token exchange with Entra ID.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Build Windows binary
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.Version=${VERSION#v} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/etc-collector-windows-amd64.exe \
            ./cmd/etc-collector

      # OIDC federated login - no secret, token exchanged on the fly from the
      # GitHub Actions ID token to an Azure access token for the etcsec-com-ci
      # service principal. The federation is tied to the 'release' environment,
      # so the token is only issuable from a job that declares environment: release.
      - name: Azure login (OIDC federated)
        if: needs.signing-preflight.outputs.mode == 'signed'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Trusted Signing issues a fresh short-lived leaf cert per call; signtool
      # drives the exchange via the Microsoft-maintained Dlib bundled with the
      # action. No PFX, no password, no renewal - the chain root (Microsoft ID
      # Verified Code Signing PCA) is already trusted on every supported Windows.
      - name: Sign Windows binary (Azure Trusted Signing)
        if: needs.signing-preflight.outputs.mode == 'signed'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Post-sign verification: without this, an action that fails quietly (or
      # becomes silently a no-op after an API change) still yields a green
      # build. Get-AuthenticodeSignature is the Windows authority on this -
      # Status must be Valid and the signer subject must be ETCSEC.
      - name: Verify Windows signature
        if: needs.signing-preflight.outputs.mode == 'signed'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $exe = "dist/etc-collector-windows-amd64.exe"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Status:                 $($sig.Status)"
          Write-Host "StatusMessage:          $($sig.StatusMessage)"
          Write-Host "SignerCertificate:      $($sig.SignerCertificate.Subject)"
          Write-Host "TimeStamperCertificate: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Post-sign verification FAILED: status=$($sig.Status), message=$($sig.StatusMessage)"
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'CN=ETCSEC') {
            Write-Error "Signer certificate subject does not match ETCSEC: $($sig.SignerCertificate.Subject)"
            exit 1
          }
          if ($sig.TimeStamperCertificate -eq $null) {
            Write-Error "Signature is not timestamped. Untimestamped signatures die with the leaf cert's 72h validity."
            exit 1
          }

      - name: Mark build as deliberately unsigned
        if: needs.signing-preflight.outputs.mode != 'signed'
        shell: bash
        run: |
          echo "::warning title=Release signing::Windows binary published UNSIGNED (ALLOW_UNSIGNED_RELEASE is set)."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/etc-collector-windows-amd64.exe

  build-linux-amd64:
    name: "Build Linux (amd64)"
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.Version=${VERSION#v} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/etc-collector-linux-amd64 \
            ./cmd/etc-collector

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/etc-collector-linux-amd64

  build-linux-arm64:
    name: "Build Linux (arm64)"
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.Version=${VERSION#v} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/etc-collector-linux-arm64 \
            ./cmd/etc-collector

      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/etc-collector-linux-arm64

  build-macos-amd64:
    name: "Build macOS (amd64)"
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Build macOS amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.Version=${VERSION#v} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/etc-collector-darwin-amd64 \
            ./cmd/etc-collector

      - name: Upload macOS amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64
          path: dist/etc-collector-darwin-amd64

  build-macos-arm64:
    name: "Build macOS (arm64 - Apple Silicon)"
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Build macOS arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X main.Version=${VERSION#v} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/etc-collector-darwin-arm64 \
            ./cmd/etc-collector

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: dist/etc-collector-darwin-arm64

  create-release:
    name: "Create GitHub Release"
    needs: [signing-preflight, build-windows, build-linux-amd64, build-linux-arm64, build-macos-amd64, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for cosign keyless signing (Sigstore/Fulcio via GitHub OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release directory structure
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          RELEASE_VERSION=${VERSION#v}

          mkdir -p dist/release

          # Windows
          mkdir -p dist/etc-collector-${RELEASE_VERSION}-windows-amd64
          cp artifacts/windows-amd64/etc-collector-windows-amd64.exe dist/etc-collector-${RELEASE_VERSION}-windows-amd64/etc-collector.exe
          cd dist && zip -r release/etc-collector-${RELEASE_VERSION}-windows-amd64.zip etc-collector-${RELEASE_VERSION}-windows-amd64 && cd ..

          # Linux amd64
          mkdir -p dist/etc-collector-${RELEASE_VERSION}-linux-amd64
          cp artifacts/linux-amd64/etc-collector-linux-amd64 dist/etc-collector-${RELEASE_VERSION}-linux-amd64/etc-collector
          cd dist && tar czf release/etc-collector-${RELEASE_VERSION}-linux-amd64.tar.gz etc-collector-${RELEASE_VERSION}-linux-amd64 && cd ..

          # Linux arm64
          mkdir -p dist/etc-collector-${RELEASE_VERSION}-linux-arm64
          cp artifacts/linux-arm64/etc-collector-linux-arm64 dist/etc-collector-${RELEASE_VERSION}-linux-arm64/etc-collector
          cd dist && tar czf release/etc-collector-${RELEASE_VERSION}-linux-arm64.tar.gz etc-collector-${RELEASE_VERSION}-linux-arm64 && cd ..

          # macOS amd64
          mkdir -p dist/etc-collector-${RELEASE_VERSION}-darwin-amd64
          cp artifacts/darwin-amd64/etc-collector-darwin-amd64 dist/etc-collector-${RELEASE_VERSION}-darwin-amd64/etc-collector
          cd dist && tar czf release/etc-collector-${RELEASE_VERSION}-darwin-amd64.tar.gz etc-collector-${RELEASE_VERSION}-darwin-amd64 && cd ..

          # macOS arm64
          mkdir -p dist/etc-collector-${RELEASE_VERSION}-darwin-arm64
          cp artifacts/darwin-arm64/etc-collector-darwin-arm64 dist/etc-collector-${RELEASE_VERSION}-darwin-arm64/etc-collector
          cd dist && tar czf release/etc-collector-${RELEASE_VERSION}-darwin-arm64.tar.gz etc-collector-${RELEASE_VERSION}-darwin-arm64 && cd ..

      - name: Generate checksums
        run: |
          cd dist/release
          sha256sum *.tar.gz *.zip > checksums.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # checksums.sha256 travels over the same channel as the artifacts, so by
      # itself it proves nothing against a compromised mirror. This detached
      # Sigstore signature is verifiable independently of the download channel.
      # Keyless signing uses the job's OIDC token - no pre-provisioned secret,
      # so this works today whether or not the Authenticode cert exists yet.
      - name: Sign checksums (detached, Sigstore keyless)
        run: |
          set -euo pipefail
          . ./scripts/lib/signing.sh
          signing_sign_checksums dist/release/checksums.sha256

      - name: Mark release as deliberately unsigned
        if: needs.signing-preflight.outputs.mode != 'signed'
        run: |
          set -euo pipefail
          . ./scripts/lib/signing.sh
          signing_write_unsigned_marker dist/release

      # ─── « Generate latest.json » retire le 2026-09-03 (T_143) ──────────────
      # Ce fichier avait l'air d'etre le manifeste de mise a jour - son nom le
      # promettait - mais rien ne savait le lire : son schema (version/downloads)
      # ne correspondait pas a la struct Manifest du code (latest/versions/
      # artifacts), et ses URL pointaient toutes vers get.etcsec.com, qui a rendu
      # 404 pendant des jours. Un fichier que personne ne lit mais dont le nom
      # promet une autorite est un piege : il ne casse rien tant qu'on l'ignore,
      # et il casse silencieusement quiconque le prend au mot.
      #
      # Depuis T_143 le collecteur lit la release publique directement, par les
      # redirections de github.com. Et un consommateur tiers qui voudrait du JSON
      # en a deja un, officiel et toujours synchrone : l'API
      # api.github.com/repos/<owner>/<repo>/releases/latest, qui rend tag_name,
      # published_at et les 9 assets avec leur browser_download_url. Republier une
      # copie moins bonne de ce que GitHub publie deja, c'est se creer une seconde
      # source de verite - precisement ce que T_143 supprime.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/checksums.sha256
            dist/release/checksums.sha256.bundle
            dist/release/UNSIGNED*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
