name: CI

on:
  push:
    branches: [main, going-go]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          flags: etc-collector
        if: github.event_name == 'push'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      # Non bloquant, et la raison est structurelle, pas de la complaisance :
      # .golangci.yml est en schema de configuration v1, que golangci-lint v2
      # refuse ; et la derniere v1 (v1.64.8) est batie avec go1.24, qui refuse une
      # cible go1.26.7. AUCUNE version ne satisfait les deux aujourd'hui.
      # Consequence a connaitre : le lint ne tourne pas, sa dette n'est donc
      # mesuree par personne. Retirer ce continue-on-error le jour ou la config est
      # migree en schema v2 — c'est la definition de "fait", pas un nettoyage
      # optionnel.
      - name: Run golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/etc-collector-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/etc-collector

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etc-collector-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/etc-collector-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: etc-collector:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          # `set +e` est indispensable : GitHub lance chaque `run` avec `bash -e`,
          # et govulncheck sort en 3 des qu'il trouve une vulnerabilite. Sans lui,
          # l'etape meurt a la ligne d'appel et tout ce qui suit est du code mort.
          set +e -uo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... > govulncheck-report.txt 2>&1
          rc=$?
          cat govulncheck-report.txt

          REACHABLE=$(grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' govulncheck-report.txt \
            | grep -oE 'GO-[0-9]+-[0-9]+' | sort -u)

          # Exception acceptee et tracee : GO-2026-5051, github.com/hirochachacha/go-smb2.
          # Lecture hors-bornes possible sur un serveur SMB malveillant. "Fixed in: N/A"
          # en amont — le correctif n'existe que dans un fork communautaire, sous un
          # autre chemin d'import. Migrer est un changement de dependance, pas un bump.
          # Retirer cette ligne le jour ou l'amont publie un correctif, pas avant.
          ACCEPTED="GO-2026-5051"
          UNEXPECTED=$(comm -23 <(echo "$REACHABLE") <(echo "$ACCEPTED") 2>/dev/null | sed '/^$/d')

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::govulncheck found reachable vulnerabilities NOT in the accepted list: $UNEXPECTED"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ -z "$REACHABLE" ]; then
            echo "::error::govulncheck exited $rc with no parseable finding — tool or network error."
            exit "$rc"
          fi
          echo "govulncheck: clean except the accepted, tracked exception ($ACCEPTED)." 
